    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0px;">
      <sc-for list="{{pinned}}" as="a" hint-placeholder-count="8">
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0px; border: 0px; background: none; cursor: pointer; font-family: Inter, sans-serif;">

        </button>
      </sc-for>
    </div>
  </section>

  <section aria-labelledby="all-h" style="position: absolute; left: 40px; top: 342px; width: 1200px;">

      <sc-for list="{{all}}" as="a" hint-placeholder-count="16">
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0px; border: 0px; background: none; cursor: pointer; font-family: Inter, sans-serif;">

          <span style="font-size: 13px; font-weight: 500; color: #C7C7CC;">{{a.name}}</span>
        </button>
      </sc-for>
