<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartridge — Quick menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Audiowide&amp;family=Bungee&amp;family=Press+Start+2P&amp;family=Righteous&amp;family=Russo+One&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000000; font-family: Inter, -apple-system, system-ui, sans-serif; color: #F5F5F7;">
  <div aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; filter: blur(6px) brightness(0.45);">
    <dc-import name="Main" hint-size="1280px,720px"></dc-import>
  </div>

  <aside aria-label="Quick menu" style="position: absolute; right: 24px; top: 24px; bottom: 24px; width: 400px; padding: 22px; box-sizing: border-box; border-radius: 30px; background: rgba(28,28,30,0.78); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0px 30px 80px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums;">21:47</span>
        <span style="margin-top: 6px; font-size: 14px; color: #A1A1A6;">Wednesday, 18 November</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
        <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">82%</span>
        <span style="font-size: 12px; color: #A1A1A6;">About 3 h 40 min left</span>
      </div>
    </div>
    <div role="meter" aria-label="Battery" aria-valuemin="0" aria-valuemax="100" aria-valuenow="82" style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden;"><div style="width: 82%; height: 6px; border-radius: 3px; background: #30D158;"></div></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{t.pressed}}" style="height: 66px; padding: 0px 12px; border-radius: 18px; border: 0px; background: {{t.bg}}; display: flex; align-items: center; gap: 10px; text-align: left; font-family: Inter, sans-serif; color: {{t.fg}}; cursor: pointer; box-shadow: {{t.ring}};">
          <span style="width: 38px; height: 38px; border-radius: 19px; background: {{t.iconBg}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.iconFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0px;"><span style="font-size: 14px; font-weight: 600;">{{t.label}}</span><span style="font-size: 12px; color: {{t.subFg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.sub}}</span></span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{sliders}}" as="s" hint-placeholder-count="2">
        <div role="slider" tabindex="0" aria-label="{{s.label}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{s.v}}" style="position: relative; height: 46px; border-radius: 23px; background: rgba(255,255,255,0.10); overflow: hidden;">
          <div style="position: absolute; left: 0px; top: 0px; bottom: 0px; width: {{s.v}}%; background: #F5F5F7;"></div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 13px;"><path d="{{s.icon}}"></path></svg>
          <span style="position: absolute; right: 18px; top: 14px; font-size: 13px; font-weight: 600; color: #C7C7CC; font-variant-numeric: tabular-nums;">{{s.v}}%</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase; padding-left: 4px;">Performance</span>
      <div role="radiogroup" aria-label="Performance" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.08);">
        <button type="button" role="radio" aria-checked="false" style="height: 36px; border-radius: 10px; border: 0px; background: transparent; color: #F5F5F7; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;">Quiet</button>
        <button type="button" role="radio" aria-checked="true" style="height: 36px; border-radius: 10px; border: 0px; background: #F5F5F7; color: #000000; font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;">Balanced</button>
        <button type="button" role="radio" aria-checked="false" style="height: 36px; border-radius: 10px; border: 0px; background: transparent; color: #F5F5F7; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;">Boost</button>
      </div>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <button type="button" style="height: 44px; border-radius: 14px; border: 0px; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;">Sleep</button>
      <button type="button" style="height: 44px; border-radius: 14px; border: 0px; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;">Restart</button>
      <button type="button" style="height: 44px; border-radius: 14px; border: 0px; background: rgba(255,69,58,0.16); color: #FF6961; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;">Power off</button>
    </div>
  </aside>

  <div style="position: absolute; left: 40px; bottom: 28px; display: flex; align-items: center; gap: 24px;">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #F5F5F7; text-decoration: none;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">B</span>Close</a>
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; background: #F5F5F7; color: #000000; font-size: 12px; font-weight: 800;">A</span>Toggle</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const T = [
      ['Wi-Fi', 'Home 5G', 'M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M12 19h.01', true, false],
      ['Bluetooth', '2 controllers', 'M7 7l10 10-5 5V2l5 5L7 17', true, true],
      ['Do Not Disturb', 'Off', 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z', false, false],
      ['Record', 'Clip last 30 s', 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', false, false]
    ];
    const tiles = T.map((t) => ({
      label: t[0], sub: t[1], icon: t[2],
      pressed: t[3] ? 'true' : 'false',
      bg: t[4] ? '#F5F5F7' : 'rgba(255,255,255,0.08)',
      fg: t[4] ? '#000000' : '#F5F5F7',
      subFg: t[4] ? '#3A3A3C' : '#A1A1A6',
      iconBg: t[3] ? '#0A84FF' : 'rgba(255,255,255,0.14)',
      iconFg: '#FFFFFF',
      ring: t[4] ? '0px 12px 30px rgba(0,0,0,0.45)' : 'none'
    }));
    const sliders = [
      { label: 'Brightness', v: 72, icon: 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' },
      { label: 'Volume', v: 48, icon: 'M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7' }
    ];
    return { tiles, sliders };
  }
}
</script>
</body>
</html>
