<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartridge — Pause menu, controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000000; font-family: Inter, -apple-system, system-ui, sans-serif; color: #F5F5F7;">

  <div aria-hidden="true" style="position: absolute; left: 100px; top: 0px; width: 1080px; height: 720px; filter: blur(28px) brightness(0.55);">
    <dc-import name="Media" scene="forest" w="{{gw}}" h="{{gh}}" hint-size="1080px,720px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0px; top: 0px; right: 0px; bottom: 0px; background: rgba(0,0,0,0.25);"></div>

  <div style="position: absolute; left: 24px; top: 24px;">
    <dc-import name="PauseMenu" sel="{{sel}}" hint-size="300px,672px"></dc-import>
  </div>

  <section aria-labelledby="pane-title" style="position: absolute; left: 348px; right: 24px; top: 24px; bottom: 88px; padding: 30px 32px; box-sizing: border-box; border-radius: 28px; background: rgba(28,28,30,0.74); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h2 id="pane-title" style="margin: 0px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Controls</h2>
        <span style="font-size: 13px; color: #A1A1A6; display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #30D158; display: inline-block;"></span>Wireless Controller · connected · 74% battery</span>
      </div>
      <div role="tablist" aria-label="Player" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.08);">
        <button type="button" role="tab" aria-selected="true" style="height: 32px; padding: 0px 16px; border-radius: 9px; border: 0px; background: #F5F5F7; color: #000000; font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;">Player 1</button>
        <button type="button" role="tab" aria-selected="false" style="height: 32px; padding: 0px 16px; border-radius: 9px; border: 0px; background: transparent; color: #8E8E93; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;">Link cable · off</button>
      </div>
    </div>

    <div style="margin-top: 26px; display: flex; gap: 32px;">
      <div style="width: 352px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px;">
        <div aria-hidden="true" style="position: relative; width: 352px; height: 236px; border-radius: 20px; background: rgba(0,0,0,0.28);">
          <div style="position: absolute; left: 40px; top: 44px; width: 70px; height: 18px; border-radius: 9px 9px 3px 3px; background: #3A3A3C; color: #C7C7CC; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center;">L</div>
          <div style="position: absolute; right: 40px; top: 44px; width: 70px; height: 18px; border-radius: 9px 9px 3px 3px; background: #3A3A3C; color: #C7C7CC; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center;">R</div>
          <div style="position: absolute; left: 30px; top: 56px; width: 292px; height: 134px; border-radius: 48px; background: #2C2C2E; box-shadow: inset 0px 1px 0px rgba(255,255,255,0.08);"></div>
          <div style="position: absolute; left: 116px; top: 76px; width: 120px; height: 82px; border-radius: 8px; background: #141416; box-shadow: inset 0px 0px 0px 1px rgba(255,255,255,0.06);"></div>
          <div style="position: absolute; left: 66px; top: 94px; width: 18px; height: 52px; border-radius: 3px; background: #48484A;"></div>
          <div style="position: absolute; left: 49px; top: 111px; width: 52px; height: 18px; border-radius: 3px; background: #48484A;"></div>
          <div style="position: absolute; left: 52px; top: 162px; width: 18px; height: 7px; border-radius: 4px; background: #48484A;"></div>
          <div style="position: absolute; left: 78px; top: 162px; width: 18px; height: 7px; border-radius: 4px; background: #48484A;"></div>
          <div style="position: absolute; left: 276px; top: 92px; width: 28px; height: 28px; border-radius: 14px; background: #636366; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">A</div>
          <div style="position: absolute; left: 246px; top: 118px; width: 28px; height: 28px; border-radius: 14px; background: #0A84FF; box-shadow: 0px 0px 0px 4px rgba(10,132,255,0.35), 0px 0px 24px rgba(10,132,255,0.7); color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">B</div>
          <div style="position: absolute; left: 0px; right: 0px; bottom: 14px; text-align: center; font-size: 12px; color: #A1A1A6;">Game layout · GBA</div>
        </div>

        <div style="border-radius: 16px; background: rgba(255,255,255,0.06); overflow: hidden;">
          <label style="height: 48px; padding: 0px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; cursor: pointer;">
            Left stick moves D-Pad
            <input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
            <span aria-hidden="true" style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #30D158; display: inline-block;"><span style="position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF;"></span></span>
          </label>
          <div style="height: 1px; margin-left: 16px; background: rgba(255,255,255,0.08);"></div>
          <label style="height: 48px; padding: 0px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; cursor: pointer;">
            Turbo on A
            <input type="checkbox" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
            <span aria-hidden="true" style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #48484A; display: inline-block;"><span style="position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF;"></span></span>
          </label>
        </div>
      </div>

      <div style="flex: 1 1 auto; min-width: 0px; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; padding: 0px 14px 10px; font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase;"><span>Game button</span><span>Your controller</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <sc-for list="{{maps}}" as="r" hint-placeholder-count="7">
            <button type="button" style="height: 44px; padding: 0px 14px; border-radius: 10px; border: 0px; display: flex; align-items: center; justify-content: space-between; background: {{r.bg}}; box-shadow: {{r.ring}}; font-family: Inter, sans-serif; color: #F5F5F7; cursor: pointer;">
              <span style="font-size: 14px; font-weight: 600;">{{r.game}}</span>
              <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: {{r.fg}};">{{r.device}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <footer style="position: absolute; left: 348px; right: 24px; bottom: 24px; height: 48px; padding: 0px 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 13px; color: #C7C7CC;">Changes apply to The Minish Cap only · Y saves them for all GBA games</span>
    <div style="display: flex; align-items: center; gap: 24px;">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; background: #F5F5F7; color: #000000; font-size: 12px; font-weight: 800;">A</span>Remap</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">X</span>Clear</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">Y</span>Save as default</span>
      <a href="Pause.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #F5F5F7; text-decoration: none;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">B</span>Back</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const MAPS = [
      ['D-Pad', 'D-Pad'], ['A', 'A · East'], ['B', 'Press a button…', 'listen'],
      ['L', 'L1'], ['R', 'R1'], ['Start', 'Menu'], ['Select', 'View']
    ];
    const maps = MAPS.map((m) => ({
      game: m[0], device: m[1],
      bg: m[2] ? 'rgba(10,132,255,0.18)' : 'transparent',
      ring: m[2] ? '0px 0px 0px 2px #0A84FF' : 'none',
      fg: m[2] ? '#64B5FF' : '#C7C7CC'
    }));
    return { maps, sel: 2, gw: 1080, gh: 720 };
  }
}
</script>
</body>
</html>
