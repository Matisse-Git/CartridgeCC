<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause menu sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Pause menu" style="width: 300px; height: 672px; padding: 20px 14px; box-sizing: border-box; border-radius: 28px; background: rgba(28,28,30,0.74); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 18px; font-family: Inter, -apple-system, system-ui, sans-serif; color: #F5F5F7;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 0px 6px;">
    <div aria-hidden="true" style="width: 42px; height: 46px; border-radius: 4px; background: linear-gradient(160deg, #3E5744, #7C9273); box-shadow: inset 0px 0px 0px 1px rgba(255,255,255,0.12); flex-shrink: 0;"></div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0px;">
      <span style="font-size: 11px; font-weight: 600; color: #A1A1A6; letter-spacing: 0.04em; text-transform: uppercase;">The Legend of Zelda</span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">The Minish Cap</span>
      <span style="font-size: 12px; color: #A1A1A6; font-variant-numeric: tabular-nums;">GBA · mGBA · 0:42:18</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
    <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
      <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0px; border: 0px; background: none; cursor: pointer; font-family: Inter, sans-serif;">
        <span style="width: 50px; height: 50px; border-radius: 25px; background: rgba(255,255,255,0.10); display: inline-flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{q.fill}}" stroke="{{q.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg></span>
        <span style="font-size: 11px; font-weight: 500; color: #C7C7CC;">{{q.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 0px 6px;"></div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
      <a href="{{m.href}}" aria-current="{{m.current}}" style="height: 44px; padding: 0px 14px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; background: {{m.bg}}; color: {{m.fg}}; font-size: 15px; font-weight: {{m.weight}};">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
        <span style="flex: 1 1 auto;">{{m.label}}</span>
        <span style="font-size: 13px; font-weight: 500; color: {{m.valFg}};">{{m.value}}</span>
      </a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sel":{"editor":"int","default":1,"min":0,"max":7},"$preview":{"width":300,"height":672}}'>
class Component extends DCLogic {
  renderVals() {
    const SEL = Number(this.props.sel ?? 1);
    const MENU = [
      ['Resume', 'M7 4.5v15l12-7.5z', 'Launch.dc.html', ''],
      ['Save States', 'M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7', 'Pause.dc.html', '5'],
      ['Controls', 'M7 8h10a5 5 0 0 1 4.8 6.3l-1 3.4a2.5 2.5 0 0 1-4.3.9L14.5 16h-5l-2 2.6a2.5 2.5 0 0 1-4.3-.9l-1-3.4A5 5 0 0 1 7 8zM8 11v4M6 13h4M16 12h.01M18 14h.01', 'PauseInput.dc.html', 'P1'],
      ['Core Settings', 'M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3', 'PauseCore.dc.html', ''],
      ['Display & Shaders', 'M3 5h18v12H3zM8 21h8M12 17v4', '#', 'LCD Grid'],
      ['Cheats', 'M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8zM19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z', '#', 'Off'],
      ['Reset Game', 'M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4', '#', ''],
      ['Quit Game', 'M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10', 'Main.dc.html', '']
    ];
    const menu = MENU.map((m, i) => {
      const sel = i === SEL;
      const quit = m[0] === 'Quit Game';
      return {
        label: m[0], icon: m[1], href: m[2], value: m[3],
        current: sel ? 'page' : 'false',
        bg: sel ? '#F5F5F7' : 'transparent',
        fg: sel ? '#000000' : (quit ? '#FF6961' : '#F5F5F7'),
        valFg: sel ? '#3A3A3C' : '#8E8E93',
        weight: sel ? 600 : 500
      };
    });
    const quick = [
      { label: 'Rewind', icon: 'M11 6v12L3 12zM21 6v12l-8-6z', fill: '#F5F5F7', stroke: 'none' },
      { label: 'Fast 2×', icon: 'M3 6v12l8-6zM13 6v12l8-6z', fill: '#F5F5F7', stroke: 'none' },
      { label: 'Capture', icon: 'M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z', fill: 'none', stroke: '#F5F5F7' },
      { label: 'Mute', icon: 'M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6', fill: 'none', stroke: '#F5F5F7' }
    ];
    return { menu, quick };
  }
}
</script>
</body>
</html>
