<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartridge — Settings</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Audiowide&amp;family=Bungee&amp;family=Press+Start+2P&amp;family=Righteous&amp;family=Russo+One&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000000; font-family: Inter, -apple-system, system-ui, sans-serif; color: #F5F5F7;">
  <header style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 76px; padding: 0px 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 260px; display: flex; align-items: center; gap: 10px;">
      <svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true"><path d="M4 1h14a2.5 2.5 0 0 1 2.5 2.5V21a2 2 0 0 1-2 2h-3v-2.5h-9V23h-3a2 2 0 0 1-2-2V3.5A2.5 2.5 0 0 1 4 1z" fill="#F5F5F7"></path><rect x="5" y="5" width="12" height="8" rx="1.5" fill="#000000"></rect><rect x="6" y="16" width="2" height="2.5" rx="0.6" fill="#000000"></rect><rect x="10" y="16" width="2" height="2.5" rx="0.6" fill="#000000"></rect><rect x="14" y="16" width="2" height="2.5" rx="0.6" fill="#000000"></rect></svg>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">Cartridge</span>
    </div>
    <nav aria-label="Main" style="display: flex; align-items: center; gap: 12px;">
      <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 22px; border-radius: 7px; border: 1.5px solid rgba(245,245,247,0.35); box-sizing: border-box; font-size: 10px; font-weight: 700; color: #A1A1A6;">L1</span>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.06);">
        <a href="Main.dc.html" style="padding: 8px 18px; border-radius: 999px; color: #F5F5F7; font-size: 14px; font-weight: 500; text-decoration: none;">Library</a>
        <a href="Systems.dc.html" style="padding: 8px 18px; border-radius: 999px; color: #F5F5F7; font-size: 14px; font-weight: 500; text-decoration: none;">Systems</a>
        <a href="Apps.dc.html" style="padding: 8px 18px; border-radius: 999px; color: #F5F5F7; font-size: 14px; font-weight: 500; text-decoration: none;">Apps</a>
        <a href="Settings.dc.html" aria-current="page" style="padding: 8px 18px; border-radius: 999px; background: #F5F5F7; color: #000000; font-size: 14px; font-weight: 600; text-decoration: none;">Settings</a>

      <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 22px; border-radius: 7px; border: 1.5px solid rgba(245,245,247,0.35); box-sizing: border-box; font-size: 10px; font-weight: 700; color: #A1A1A6;">R1</span>
    </nav>
    <div style="width: 260px; display: flex; justify-content: flex-end; align-items: center; gap: 14px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;">
      <svg width="18" height="14" viewBox="0 0 24 18" fill="none" stroke="#F5F5F7" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="Wi-Fi connected"><path d="M2 6.5a15 15 0 0 1 20 0"></path><path d="M5.5 10a10 10 0 0 1 13 0"></path><path d="M9 13.5a5 5 0 0 1 6 0"></path><circle cx="12" cy="16.5" r="1" fill="#F5F5F7"></circle></svg>
      <span style="display: inline-flex; align-items: center; gap: 6px; color: #A1A1A6;">82%
        <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="0.75" y="0.75" width="21.5" height="11.5" rx="3.5" fill="none" stroke="#F5F5F7" stroke-opacity="0.45" stroke-width="1.5"></rect><rect x="3" y="3" width="15" height="7" rx="1.5" fill="#F5F5F7"></rect><path d="M24 4.5v4" stroke="#F5F5F7" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round"></path></svg>
      </span>
      <span>21:47</span>
    </div>
  </header>

  <nav aria-label="Settings sections" style="position: absolute; left: 40px; top: 100px; width: 280px; display: flex; flex-direction: column; gap: 2px;">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="10">
      <a href="#" aria-current="{{s.current}}" style="height: 46px; padding: 0px 10px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; background: {{s.bg}}; color: {{s.fg}}; font-size: 15px; font-weight: {{s.weight}};">
        <span style="width: 28px; height: 28px; border-radius: 8px; background: {{s.tile}}; display: inline-flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
        {{s.label}}
      </a>
    </sc-for>
  </nav>

  <main style="position: absolute; left: 352px; top: 96px; width: 888px;">
    <h1 style="margin: 0px 0px 20px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em;">Library</h1>
    <div style="display: flex; gap: 24px; align-items: flex-start;">
      <div style="flex: 1 1 auto; min-width: 0px; display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="padding-left: 16px; font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase;">Game folders</span>
          <div style="border-radius: 16px; background: #1C1C1E; padding: 4px;">
            <sc-for list="{{folders}}" as="f" hint-placeholder-count="3">
              <button type="button" style="width: 100%; height: 52px; padding: 0px 12px; border-radius: 12px; border: 0px; display: flex; align-items: center; gap: 12px; text-align: left; background: {{f.bg}}; color: {{f.fg}}; font-family: Inter, sans-serif; cursor: pointer; box-shadow: {{f.ring}};">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{f.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"></path></svg>
                <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; min-width: 0px;"><span style="font-size: 14px; font-weight: 600;">{{f.path}}</span><span style="font-size: 12px; color: {{f.subFg}};">{{f.sub}}</span></span>
                <span style="font-size: 13px; font-weight: 500; color: {{f.subFg}}; font-variant-numeric: tabular-nums;">{{f.count}}</span>
                <svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="{{f.subFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l4 4-4 4"></path></svg>
              </button>
            </sc-for>
            <button type="button" style="width: 100%; height: 48px; padding: 0px 12px; border-radius: 12px; border: 0px; display: flex; align-items: center; gap: 12px; background: transparent; color: #409CFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#409CFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              Add folder…
            </button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="padding-left: 16px; font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase;">Scanning</span>
          <div style="border-radius: 16px; background: #1C1C1E; padding: 4px 4px 4px 16px;">
            <div style="height: 52px; padding-right: 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
              <span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 14px; font-weight: 500;">Scan for new games</span><span style="font-size: 12px; color: #8E8E93;">Last scan 2 hours ago · 1,284 games found</span></span>
              <button type="button" style="height: 32px; padding: 0px 14px; border-radius: 16px; border: 0px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;">Scan now</button>
            </div>
            <label style="height: 52px; padding-right: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; cursor: pointer;">
              Scan when Cartridge starts
              <input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
              <span aria-hidden="true" style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #30D158; display: inline-block;"><span style="position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF;"></span></span>
            </label>
          </div>
        </div>
      </div>

      <div style="width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
        <span style="padding-left: 16px; font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase;">Box art</span>
        <div style="border-radius: 16px; background: #1C1C1E; overflow: hidden;">
          <div style="height: 168px; display: flex; align-items: flex-end; justify-content: center; gap: 22px; padding-bottom: 20px; box-sizing: border-box; background: #000000;">
            <dc-import name="Box" game="{{g1}}" w="{{w1}}" h="{{h1}}" d="{{sd}}" ry="{{r1}}" tz="{{zero}}" dim="{{zero}}" focused="{{yes}}" pad="{{zero}}" hint-size="86px,121px"></dc-import>
            <dc-import name="Box" game="{{g2}}" w="{{w2}}" h="{{h2}}" d="{{sd}}" ry="{{r2}}" tz="{{zero}}" dim="{{zero}}" focused="{{yes}}" pad="{{zero}}" hint-size="100px,111px"></dc-import>
          </div>
          <div style="padding: 4px 4px 4px 16px;">
            <label style="height: 50px; padding-right: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer;">
              Show boxes in 3D
              <input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
              <span aria-hidden="true" style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #30D158; display: inline-block;"><span style="position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF;"></span></span>
            </label>
            <label style="height: 50px; padding-right: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer;">
              Download missing art
              <input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
              <span aria-hidden="true" style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #30D158; display: inline-block;"><span style="position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF;"></span></span>
            </label>
            <button type="button" style="width: 100%; height: 50px; padding: 0px 8px 0px 0px; border: 0px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-family: Inter, sans-serif; color: #F5F5F7; cursor: pointer;">
              <span style="font-size: 14px; font-weight: 500;">Art source</span>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #A1A1A6;">Local files first<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l4 4-4 4"></path></svg></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer style="position: absolute; left: 0px; bottom: 0px; width: 1280px; height: 64px; padding: 0px 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 13px; color: #8E8E93;">Cartridge 1.0 · default home app</span>
    <div style="display: flex; align-items: center; gap: 26px;">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; background: #F5F5F7; color: #000000; font-size: 12px; font-weight: 800;">A</span>Select</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">X</span>Remove folder</span>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #F5F5F7; text-decoration: none;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">B</span>Back</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [
      ['Library', '#0A84FF', 'M4 5h4v14H4zM10 5h4v14h-4zM16 6l3.5-1 2.5 13.5-3.5 1z'],
      ['Systems & Cores', '#5E5CE6', 'M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM9 9h6v6H9z'],
      ['Controllers', '#30D158', 'M7 8h10a5 5 0 0 1 4.8 6.3l-1 3.4a2.5 2.5 0 0 1-4.3.9L14.5 16h-5l-2 2.6a2.5 2.5 0 0 1-4.3-.9l-1-3.4A5 5 0 0 1 7 8zM8 11v4M6 13h4'],
      ['Display', '#FF9F0A', 'M3 5h18v12H3zM8 21h8M12 17v4'],
      ['Appearance', '#BF5AF2', 'M12 21a9 9 0 1 1 0-18c5 0 9 3.6 9 8 0 2.8-2.2 4-4.5 4H15a2 2 0 0 0-1.5 3.3A1.6 1.6 0 0 1 12 21zM7.5 11h.01M10 7h.01M15 7h.01'],
      ['Sound', '#FF375F', 'M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7'],
      ['Storage', '#636366', 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'],
      ['Network', '#0A84FF', 'M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M12 19h.01'],
      ['Android', '#34C759', 'M5 10h14v9H5zM8 10V8a4 4 0 0 1 8 0v2M9 6.5L7.5 4.5M15 6.5l1.5-2'],
      ['About', '#8E8E93', 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v6M12 7.5h.01']
    ];
    const sections = S.map((s, i) => {
      const sel = i === 0;
      return { label: s[0], tile: s[1], icon: s[2], current: sel ? 'page' : 'false', bg: sel ? '#2C2C2E' : 'transparent', fg: '#F5F5F7', weight: sel ? 600 : 500 };
    });
    const F = [
      ['SD card › Games › SNES', 'Super Nintendo', '214'],
      ['SD card › Games › GBA', 'Game Boy Advance', '187'],
      ['Internal › ROMs', '8 systems detected', '883']
    ];
    const folders = F.map((f, i) => {
      const sel = i === 0;
      return { path: f[0], sub: f[1], count: f[2], bg: sel ? '#F5F5F7' : 'transparent', fg: sel ? '#000000' : '#F5F5F7', subFg: sel ? '#3A3A3C' : '#8E8E93', ring: 'none' };
    });
    const g1 = { title: 'Final Fantasy X', short: 'Final Fantasy X', sys: 'PS2', year: '2001', t1: '#2C4452', t2: '#5E7D8C' };
    const g2 = { title: 'Golden Sun', short: 'Golden Sun', sys: 'GBA', year: '2001', t1: '#6A5636', t2: '#A38C5E' };
    return { sections, folders, g1, g2, w1: 86, h1: 121, w2: 100, h2: 111, sd: 12, r1: 30, r2: -30, zero: 0, yes: true };
  }
}
</script>
</body>
</html>
