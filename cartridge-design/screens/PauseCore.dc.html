<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartridge — Pause menu, core settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000000; font-family: Inter, -apple-system, system-ui, sans-serif; color: #F5F5F7;">

  <div aria-hidden="true" style="position: absolute; left: 100px; top: 0px; width: 1080px; height: 720px; filter: blur(28px) brightness(0.55);">
    <dc-import name="Media" scene="forest" w="{{gw}}" h="{{gh}}" hint-size="1080px,720px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0px; top: 0px; right: 0px; bottom: 0px; background: rgba(0,0,0,0.25);"></div>

  <div style="position: absolute; left: 24px; top: 24px;">
    <dc-import name="PauseMenu" sel="{{sel}}" hint-size="300px,672px"></dc-import>
  </div>

  <section aria-labelledby="pane-title" style="position: absolute; left: 348px; right: 24px; top: 24px; bottom: 88px; padding: 30px 32px; box-sizing: border-box; border-radius: 28px; background: rgba(28,28,30,0.74); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h2 id="pane-title" style="margin: 0px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Core Settings</h2>
        <span style="font-size: 13px; color: #A1A1A6;">Changes take effect instantly · some need a reset</span>
      </div>
      <div role="radiogroup" aria-label="Apply to" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.08);">
        <button type="button" role="radio" aria-checked="true" style="height: 32px; padding: 0px 16px; border-radius: 9px; border: 0px; background: #F5F5F7; color: #000000; font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;">This game</button>
        <button type="button" role="radio" aria-checked="false" style="height: 32px; padding: 0px 16px; border-radius: 9px; border: 0px; background: transparent; color: #F5F5F7; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;">All GBA games</button>
      </div>
    </div>

    <div style="margin-top: 22px; display: flex; gap: 24px;">
      <div style="flex: 1 1 auto; min-width: 0px; display: flex; flex-direction: column; gap: 16px;">
        <div style="height: 64px; padding: 0px 16px; border-radius: 16px; background: rgba(255,255,255,0.06); display: flex; align-items: center; gap: 14px;">
          <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 10px; background: #F5F5F7; display: inline-flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM9 9h6v6H9z"></path></svg></span>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 700;">mGBA <span style="font-weight: 500; color: #8E8E93; font-size: 13px;">0.10</span></span>
            <span style="font-size: 12px; color: #A1A1A6;">Accurate and fast · recommended for GBA</span>
          </div>
          <button type="button" style="height: 34px; padding: 0px 14px; border-radius: 17px; border: 0px; background: rgba(255,255,255,0.12); color: #F5F5F7; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;">Change core</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="padding-left: 16px; font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase;">Performance</span>
          <div style="border-radius: 16px; background: rgba(255,255,255,0.06); padding: 4px;">
            <div style="height: 44px; padding: 0px 12px; border-radius: 12px; background: #F5F5F7; color: #000000; display: flex; align-items: center; justify-content: space-between;">
              <span style="font-size: 14px; font-weight: 600;">Run-ahead</span>
              <span style="display: inline-flex; align-items: center; gap: 10px;">
                <button type="button" aria-label="Fewer frames" style="width: 28px; height: 28px; border-radius: 14px; border: 0px; background: rgba(0,0,0,0.08); font-size: 16px; font-weight: 600; cursor: pointer; color: #000000;">−</button>
                <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 56px; text-align: center;">1 frame</span>
                <button type="button" aria-label="More frames" style="width: 28px; height: 28px; border-radius: 14px; border: 0px; background: rgba(0,0,0,0.08); font-size: 16px; font-weight: 600; cursor: pointer; color: #000000;">+</button>
              </span>
            </div>
            <sc-for list="{{perf}}" as="r" hint-placeholder-count="2">
              <button type="button" style="width: 100%; height: 44px; padding: 0px 12px; border-radius: 12px; border: 0px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-family: Inter, sans-serif; color: #F5F5F7; cursor: pointer;">
                <span style="font-size: 14px; font-weight: 500;">{{r.label}}</span>
                <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #A1A1A6;">{{r.value}}<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l4 4-4 4"></path></svg></span>
              </button>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="padding-left: 16px; font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase;">Emulation</span>
          <div style="border-radius: 16px; background: rgba(255,255,255,0.06); padding: 4px;">
            <sc-for list="{{emu}}" as="r" hint-placeholder-count="2">
              <button type="button" style="width: 100%; height: 44px; padding: 0px 12px; border-radius: 12px; border: 0px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-family: Inter, sans-serif; color: #F5F5F7; cursor: pointer;">
                <span style="font-size: 14px; font-weight: 500;">{{r.label}}</span>
                <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #A1A1A6;">{{r.value}}<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l4 4-4 4"></path></svg></span>
              </button>
            </sc-for>
            <label style="height: 44px; padding: 0px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; cursor: pointer;">
              Interframe blending
              <input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
              <span aria-hidden="true" style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: #30D158; display: inline-block;"><span style="position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF;"></span></span>
            </label>
          </div>
        </div>
      </div>

      <div style="width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
        <span style="padding-left: 16px; font-size: 12px; font-weight: 600; color: #8E8E93; letter-spacing: 0.04em; text-transform: uppercase;">Display</span>
        <div style="border-radius: 16px; background: rgba(255,255,255,0.06); padding: 14px; display: flex; flex-direction: column; gap: 12px;">
          <div aria-hidden="true" style="position: relative; width: 292px; height: 195px; border-radius: 12px; overflow: hidden;">
            <dc-import name="Media" scene="forest" w="{{pw}}" h="{{ph}}" hint-size="292px,195px"></dc-import>
            <div style="position: absolute; left: 0px; top: 0px; right: 0px; bottom: 0px; background: linear-gradient(rgba(0,0,0,0.22) 1px, transparent 1px) 0px 0px / 4px 4px, linear-gradient(90deg, rgba(0,0,0,0.22) 1px, transparent 1px) 0px 0px / 4px 4px;"></div>
            <span style="position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.65); font-size: 11px; font-weight: 700; color: #FFFFFF;">Live preview</span>
          </div>
          <div style="display: flex; flex-direction: column;">
            <sc-for list="{{disp}}" as="r" hint-placeholder-count="3">
              <button type="button" style="height: 40px; padding: 0px 4px; border: 0px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-family: Inter, sans-serif; color: #F5F5F7; cursor: pointer;">
                <span style="font-size: 14px; font-weight: 500;">{{r.label}}</span>
                <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #A1A1A6;">{{r.value}}<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l4 4-4 4"></path></svg></span>
              </button>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer style="position: absolute; left: 348px; right: 24px; bottom: 24px; height: 48px; padding: 0px 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 13px; color: #C7C7CC;">Run-ahead removes input lag by emulating frames ahead. Higher values use more power.</span>
    <div style="display: flex; align-items: center; gap: 24px;">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box;"><svg width="14" height="10" viewBox="0 0 24 16" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3L2 8l5 5M17 3l5 5-5 5"></path></svg></span>Adjust</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">X</span>Reset to default</span>
      <a href="Pause.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #F5F5F7; text-decoration: none;"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid rgba(245,245,247,0.55); box-sizing: border-box; font-size: 11px; font-weight: 700;">B</span>Back</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const perf = [{ label: 'Frameskip', value: 'Off' }, { label: 'Idle loop removal', value: 'Known games' }];
    const emu = [{ label: 'Color correction', value: 'GBA screen' }, { label: 'BIOS', value: 'Use if found' }];
    const disp = [{ label: 'Shader', value: 'LCD Grid' }, { label: 'Aspect ratio', value: '3:2 native' }, { label: 'Integer scaling', value: '4×' }];
    return { perf, emu, disp, sel: 3, gw: 1080, gh: 720, pw: 292, ph: 195 };
  }
}
</script>
</body>
</html>
